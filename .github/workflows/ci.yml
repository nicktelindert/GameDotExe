name: CI/CD Pipeline

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14.5'
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libxcb-cursor0 libxcb-xkb1 libxkbcommon-x11-0 libxcb-image0 libxcb-icccm4 libxcb-render-util0 libxcb-util1 libxcb-shape0 libxcb-keysyms1 libtiff6
      - name: Install dependencies
        run: |
          pip install PySide6 requests pyfakefs
      - name: Run All Tests
        run: python -m unittest discover .

  build-macos:
    name: Build macOS App Bundle
    needs: test
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14.5'
      - name: Install dependencies
        run: pip install PySide6 requests pyinstaller macholib
      - name: Build macOS App
        run: |
          chmod +x build_macos.sh
          ./build_macos.sh
      - name: Create Zip Archive
        run: |
          cd dist
          zip -r GameDotExe-macOS.zip GameDotExe.app
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GameDotExe-macOS
          path: dist/GameDotExe-macOS.zip

  build-linux:
    name: Build Linux AppImage
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14.5'
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dosbox libegl1 libopengl0 libxcb-cursor0 libxcb-xkb1 libxkbcommon-x11-0 libxcb-image0 libxcb-icccm4 libxcb-render-util0 libxcb-util1 libxcb-shape0 libxcb-keysyms1 libtiff6
      - name: Install dependencies
        run: pip install PySide6 requests pyinstaller
      - name: Symlink libtiff.so.6 to libtiff.so.5
        run: | 
          sudo ln -s /usr/lib/x86_64-linux-gnu/libtiff.so.6 /usr/lib/x86_64-linux-gnu/libtiff.so.5
      - name: Install appimagetool
        run: |
          sudo wget -O /usr/local/bin/appimagetool https://github.com/probonopd/go-appimage/releases/download/continuous/appimagetool-940-x86_64.AppImage
          sudo chmod +x /usr/local/bin/appimagetool
      - name: Build AppImage
        run: |
          # AppImageTool flag voor environments zonder FUSE (zoals GitHub runners)
          export APPIMAGETOOL_X_ARGS="--appimage-extract-and-run"
          chmod +x build_appimage.sh
          ./build_appimage.sh
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GameDotExe-Linux.AppImage
          path: dist/*.AppImage